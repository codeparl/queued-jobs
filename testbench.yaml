providers:
  - SchoolPalm\QueuedJobs\Providers\QueuedJobsServiceProvider

workbench:
  start: /workbench
  user: schoolpalm
  guard: web
  assets: false
  install: true
  health: false

  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: true

  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh


  sync:
    - from: storage
      to: workbench/storage
      reverse: true